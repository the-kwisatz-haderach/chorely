name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: chorely
          POSTGRES_PASSWORD: chorely
          POSTGRES_DB: chorely
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chorely"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://chorely:chorely@localhost:5432/chorely
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm db:migrate
      - run: pnpm test
      - run: pnpm --filter @chorely/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          CI: "true"
