name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: chorely
          POSTGRES_PASSWORD: chorely
          POSTGRES_DB: chorely
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chorely"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://chorely:chorely@localhost:5432/chorely
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint # ESLint, then Stylelint, then Prettier on Markdown
      - run: pnpm db:migrate
      - name: Check infra/sql isolates environments
        run: infra/sql/test-isolation.sh
        env:
          ADMIN_URL: postgres://chorely:chorely@localhost:5432/chorely
      - run: pnpm test
      - run: pnpm --filter @chorely/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          CI: "true"

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive infra
      # Validate and test only; applying is manual (infra/README.md).
      - name: Validate roots and test modules
        run: |
          for dir in infra/envs/* infra/modules/*; do
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
          done
          for dir in infra/modules/*; do
            terraform -chdir="$dir" test
          done
