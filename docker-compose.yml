services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: chorely
      POSTGRES_PASSWORD: chorely
      POSTGRES_DB: chorely
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chorely"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  pgdata:
